## Brantomics AI — hoofdwebsite (statische marketingsite)
## Draait naast de bestaande Kitchen-stack (chef-dash-assist) op dezelfde server.
## Kitchen's Caddy claimt al poort 80/443 — deze site publiceert daarom alleen
## intern op poort 8080 en hangt bovendien aan Kitchen's eigen docker-netwerk
## (kitchen_default), zodat Kitchen's Caddy 'm rechtstreeks als container kan
## bereiken via een extra site-blok in Kitchen's Caddyfile. Zie DEPLOY.md.
##
## Gebruik:
##   1. docker compose up -d --build
##   2. Voeg het brantomicsai.nl-blok toe aan /opt/kitchen/Caddyfile (zie DEPLOY.md)

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - default
      - kitchen_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default: {}
  kitchen_default:
    external: true
