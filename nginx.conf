server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing (react-router): onbekende paden vallen terug op index.html.
  # $uri/index.html (i.p.v. $uri/) voorkomt dat nginx's directory-index-gedrag een
  # 301-redirect naar de trailing-slash-variant triggert voor de geprerenderde routes
  # (dist/prijzen/index.html e.d.) — try_files matcht dan een bestand, geen directory.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  # Statische assets mogen langdurig gecachet worden (bevatten een content-hash).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # sitemap.xml/robots.txt/Google-verificatiebestand moeten altijd vers zijn.
  location ~* \.(xml|txt)$ {
    expires -1;
  }
}
