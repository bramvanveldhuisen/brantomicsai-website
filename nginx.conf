server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relatieve Location-headers: nginx draait achter Caddy op http en zou anders naar
  # http://brantomicsai.nl/... doorsturen, wat een extra omweg via Caddy's https-redirect geeft.
  absolute_redirect off;

  # Oude URL's van de vorige site: permanent doorsturen naar de dichtstbijzijnde nieuwe pagina,
  # zodat Google ze snel vervangt en bezoekers niet op een lege pagina uitkomen.
  location = /diensten.html         { return 301 /producten; }
  location = /prijzen.html          { return 301 /producten; }
  location = /demo-leads.html       { return 301 /producten; }
  location = /demo-responder.html   { return 301 /demo-responder; }
  location = /over-ons.html         { return 301 /over-ons; }
  location = /contact.html          { return 301 /contact; }
  location = /privacybeleid.html    { return 301 /privacybeleid; }
  location = /algemene-voorwaarden.html { return 301 /algemene-voorwaarden; }

  # Oude routes zonder .html die de app alleen in de browser doorstuurde (react-router Navigate).
  # Zonder deze regels zouden ze met de echte 404 hieronder een 404 geven.
  location = /diensten              { return 301 /producten; }
  location = /prijzen               { return 301 /producten; }

  # Brantomics Kitchen bestaat niet meer: 410 Gone zegt Google dat de pagina bewust weg is.
  location ^~ /kitchen              { return 410; }

  # Bestaande pagina's komen uit dist/<route>/index.html. Onbekende paden geven een echte 404
  # (met de homepage als inhoud), geen 200. Anders ziet Google ze als soft 404.
  # $uri/index.html (i.p.v. $uri/) voorkomt dat nginx een 301 naar de trailing-slash-variant doet.
  # no-cache: de browser vraagt bij elk bezoek even of er een nieuwe versie is (via de ETag).
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
  }
  error_page 404 /index.html;

  # Statische assets mogen langdurig gecachet worden (bevatten een content-hash).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # sitemap.xml/robots.txt/Google-verificatiebestand moeten altijd vers zijn.
  location ~* \.(xml|txt)$ {
    expires -1;
  }
}
